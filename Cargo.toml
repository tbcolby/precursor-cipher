[package]
name = "cipher-workshop"
version = "0.2.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Cipher Workshop for Precursor: classical ciphers (Caesar, ROT13, Atbash, Vigenere, substitution, rail fence) with frequency analysis, for learning"
license = "Apache-2.0"

# Package is `cipher-workshop`, not `cipher`: RustCrypto's `cipher` crate is
# already in the xous-core dependency graph. The repo name is unchanged.
# Lives at xous-core/apps/cipher-workshop/ (see xous-dev-toolkit/bin/integrate).
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
gam = { path = "../../services/gam" }
precursor-appkit = { path = "../../libs/precursor-appkit" }
cipher-workshop-core = { path = "core" }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[features]
default = []
